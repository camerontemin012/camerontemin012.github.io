<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Box Model</title>
        <script src="../validate.js"></script>
        <style>
            #red{
                background-color:LightCoral;
                height:100px;
                width:100px;
                border: 2px black solid;
                margin-left:300px;
            }
            #blue{
                background-color:SkyBlue;
                height:100px;
                width:100px;
                border: 2px black solid;
                padding:100px;
                background-clip:content-box;
                margin-left:400px;
            }
            #green{
                background-color:PaleGreen;
                height:100px;
                width:100px;
                border: 2px black solid;
                padding-left:25px;
                background-clip:content-box;
            }
            #yellow{
                background-color:LemonChiffon;
                height:100px;
                width:100px;
                border: 2px black solid;
                background-clip:content-box;
                margin-left:300px;
                padding-left:25px;
                padding-right:25px;
                padding-top:50px;
            }
            #purple{
                background-color:Lavender;
                height:100px;
                width:100px;
                border: 2px black solid;
                background-clip:content-box;
                padding-bottom:100px;
                margin-left:200px;
            }
        </style>
    </head>
    <body>
        <h1>Look at dem boxes</h1>
        <div id="red"></div>
        <div id="blue"></div>
        <div id="green"></div>
        <div id="yellow"></div>
        <div id="purple"></div>
    </body>
</html>
